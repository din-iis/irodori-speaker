checkpoint: Aratako/Irodori-TTS-v4.1-Small   # HF id / HF id/サブフォルダ / ローカル .safetensors
# 8GB で OOM になる場合: Aratako/Irodori-TTS-v4.1-Small-Quantized/int8-weight-only
codec_repo: Aratako/Semantic-DACVAE-Japanese-32dim
device: cuda            # cuda | mps | cpu（モデルとコーデックの両方）
precision: bf16         # fp32 | bf16（CUDA は bf16 が速く VRAM も半分。mps/cpu は fp32）
min_free_vram_gb: 3.0   # TTS 読み込み前の空き VRAM チェック（0 で無効）
empty_cache_interval: 10  # N 文ごとに torch.cuda.empty_cache()（0 で無効）

voices_dir: voices
# none と書くと参照音声を使わずに合成する（話者 LoRA を統合した checkpoint 向け。README の「参照音声を使わない」を参照）
voice: narrator         # voices/narrator.wav か voices/narrator/ 内の複数クリップ（名前順に連結、合計 30 秒程度が推奨）
ref_normalize_db: -16.0 # null で無効
max_ref_seconds: null   # null = チェックポイント既定（v4 は 120 秒）

# 読み辞書（漢字表記: よみ の YAML）。本ごとの out/<book>/readings.yaml があれば後勝ちで重ねる
readings: []            # 例: ["readings.yaml"]
# 未統合の話者 LoRA のアダプタのディレクトリ（adapter_config.json と adapter_model.safetensors）。null で無効
lora_adapter: null      # 例: adapters/narrator（voice: none との組み合わせを推奨）

sampling:
  num_steps: null       # null = RF 40 / MeanFlow 4
  t_schedule_mode: linear   # linear | sway
  sway_coeff: -1.0
  cfg_scale_text: 3.0
  cfg_scale_speaker: 5.0
  duration_scale: 0.8   # 長すぎると余った時間に余計な音が入る。0.8 で自然な速さを確認
  max_seconds: 30.0     # 1 文の最大長。split.max_chars と合わせる
  seed: 42              # null でランダム（文ごとに声がぶれるので固定推奨）

emotion_mode: emoji     # emoji | none
narration_intensity_shift: 1
# 感情 × 強度(1/2/3) → 挿入する絵文字。空文字は挿入なし。Irodori の対応絵文字のみ効く
emotion_emoji:
  neutral:   ["", "", ""]
  happy:     ["", "😊", "😆"]
  sad:       ["", "😟", "😭"]
  angry:     ["", "😠", "😠😠"]
  surprised: ["", "😲", "😲😲"]
  fearful:   ["", "😰", "😰😰"]
  tender:    ["", "🫶", "🫶🫶"]
  whisper:   ["", "👂", "👂👂"]
  excited:   ["", "💥", "💥💥"]
  serious:   ["", "", ""]

llm:
  api: ollama           # ollama: Ollama ネイティブ API / openai: OpenAI 互換（llama-server / vLLM / LM Studio）
  base_url: http://localhost:11434      # openai のときは http://localhost:8080/v1 など
  model: qwen3.5:4b-q8_0                # 8GB 向けの推奨。軽くするなら qwen3.5:4b-q4_K_M
  think: false          # 思考モード。true は精度が上がる可能性があるが数倍遅い
  api_key: null
  timeout: 120
  concurrency: 1        # Ollama は OLLAMA_NUM_PARALLEL、llama-server は -np に合わせる
  unload: true          # 注釈後にモデルを解放する（ollama: keep_alive=0 / openai: server_command を終了）
  # server_command:     # openai のとき、指定すると注釈の前に起動して /v1/models が応答するまで待ち、注釈後に終了させる
  #   ["llama-server", "-m", "models/Qwen3.5-4B-Q8_0.gguf", "-ngl", "99", "-c", "16384", "-np", "4", "--port", "8080"]
  server_start_timeout: 300

split:
  # chapter_regex: '^\s*第.+?[章話節].*$'
  max_chars: 40          # 長い文は後半で参照音声の声から離れるため、読点の位置で 40 文字以内に分けて合成する

read_chapter_title: true   # 章の見出しを読み上げる（false で読まない）

silence:   # 秒。文・段落の間と下の特別な間のうち、長い方を入れる
  sentence: 0.25
  paragraph: 0.6
  chapter: 1.0
  title: 1.0             # 章題の後
  scene: 2.0             # 区切り行（＊ ◇　◇　◇ …… など）の位置
  turn: 0.4              # 同じ段落で台詞と地の文が切り替わる所
  ellipsis: 0.6          # 前の文が … ‥ ― — で終わる所（閉じ括弧の前でも）

bgm:
  secrets_file: ~/.config/irodori-speaker/secrets.env   # FREESOUND_API_KEY=... の 1 行（chmod 600）
  clap_model: laion/larger_clap_general
  device: cuda              # cuda | mps | cpu（CLAP）
  candidates: 12            # 1 回の検索で取る候補数
  ambient_duration: "[30 TO 900]"
  music_duration: "[30 TO 300]"
  scene_chunk_chars: 3000   # LLM に一度に渡す本文の量
  min_scene_chars: 400      # これより短い場面は前の場面にまとめる（朗読でおよそ 1 分）
  download_workers: 6
  ambient_db: -20.0         # 朗読に対する環境音の音量
  music_db: -3.0            # 朗読に対する音楽の音量
  intro_seconds: 20.0
  bridge_seconds: 8.0
  music_fade_in: 2.0
  music_fade_out: 3.0
  ambient_crossfade: 4.0
  mp3_bitrate: 192k

check:   # check サブコマンド（品質チェック）
  z_threshold: 3.0          # 文字数あたりの秒数が中央値からこの z（MAD 基準）以上ずれた文に long / short の印
  cer_threshold: 0.3        # --asr のとき、文字誤り率がこれ以上の文に cer の印（漢字/かなの表記差で高めに出るので緩め）
  asr_model: kotoba-tech/kotoba-whisper-v2.0
  asr_device: cuda          # cuda | mps | cpu

output_dir: out
